name: Run tests

on:
  push:
    branches:
      - 'master'
      - 'release-*'
    tags: '*'
  pull_request:

concurrency:
  # group by workflow and ref; the last slightly strange component ensures that for pull
  # requests, we limit to 1 concurrent job, but for the master branch we don't
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/master' || github.run_number }}
  # Cancel intermediate builds, but only if it is a pull request build.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - lts
          - 1      # latest stable release
          #- 'nightly'
        os:
          - ubuntu-latest
        include:
          - julia-version: 1
            os: ubuntu-latest
            cxx-coverage: true
          # Add a few windows and macOS jobs (not too many, the number we can run in parallel is limited)
          - julia-version: lts
            os: macOS-latest
          #- julia-version: ls
          #  os: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # For Codecov, we must also fetch the parent of the HEAD commit to
          # be able to properly deal with PRs / merges
          fetch-depth: 2
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: "Cache artifacts"
        uses: julia-actions/cache@v3
      # Setup ccache, to speed up repeated compilation of the same binaries
      - name: "Setup ccache"
        uses: Chocobo1/setup-ccache-action@v1
        with:
          update_packager_index: false
      - name: "Build package"
        uses: julia-actions/julia-buildpkg@v1
        env:
          NORMALIZ_JL_CXX_COVERAGE: ${{ matrix.cxx-coverage == true && 'true' || 'false' }}
      - name: "Run tests"
        uses: julia-actions/julia-runtest@v1
        with:
          depwarn: error
      - name: "Run doctests"
        if: ${{ matrix.julia-version == '1.10' }}
        run: |
          julia --project=docs --color=yes --code-coverage -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            using Documenter: doctest
            using Normaliz
            doctest(Normaliz)'

      - name: "Process code coverage"
        uses: julia-actions/julia-processcoverage@v1
      - name: "Process C++ coverage"
        if: ${{ matrix.cxx-coverage == true }}
        run: |
          find deps/src/build -name '*.gcda' -exec gcov -pb -r -s "$PWD" {} \;
      - name: "Upload coverage data to Codecov"
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - name: "Cache artifacts"
        uses: julia-actions/cache@v3
      - name: "Build package"
        uses: julia-actions/julia-buildpkg@v1
      - run: |
          julia --project=docs --color=yes -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - run: |
          julia --project=docs --color=yes -e '
            using Documenter: doctest
            using Normaliz
            doctest(Normaliz)'
      - run: julia --project=docs --color=yes docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
